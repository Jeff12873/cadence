<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence</title>
<style>
:root{
  --paper:#FAFAF7; --card:#FFFFFF; --ink:#1F2937; --muted:#6B7280; --line:#E5E7EB; --head:#374151; --headwe:#9CA3AF;
  --accent:#2B4C7E; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05); --weekend:#F1F1EC;
  --routine-bg:#E8EEF6; --routine-fg:#2B4C7E; --bilan-bg:#DCD6F7; --bilan-fg:#3F2E8C; --ordi-bg:#D4F0EC; --ordi-fg:#0F6B5F;
  --corvee-bg:#FCEBC7; --corvee-fg:#8A5A00; --courses-bg:#D9F2D9; --courses-fg:#1E6B2A; --sport-bg:#FADAD7; --sport-fg:#9B2C22;
  --travaux-bg:#F6DEC9; --travaux-fg:#8A4512; --loisir-bg:#F3D9F0; --loisir-fg:#7E2A73; --soir-bg:#DDE3F0; --soir-fg:#26324F;
  --pause-bg:transparent; --pause-fg:#9CA3AF;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15171C; --card:#1D2027; --ink:#E5E7EB; --muted:#9CA3AF; --line:#2C303A; --head:#3B4252; --headwe:#2C303A;
  --accent:#9DB8E6; --shadow:0 1px 2px rgba(0,0,0,.4); --weekend:#1A1C21;
  --routine-bg:#22304A; --routine-fg:#B7CBEE; --bilan-bg:#2E2850; --bilan-fg:#CFC6FF; --ordi-bg:#173B37; --ordi-fg:#9EE3D8;
  --corvee-bg:#3D3016; --corvee-fg:#F2CF83; --courses-bg:#1B3A21; --courses-fg:#A6E3AF; --sport-bg:#46201D; --sport-fg:#F5B3AC;
  --travaux-bg:#43301F; --travaux-fg:#F1C29B; --loisir-bg:#3D2140; --loisir-fg:#EDB8E6; --soir-bg:#262E42; --soir-fg:#C3CDE6;
}}
:root[data-theme="dark"]{
  --paper:#15171C; --card:#1D2027; --ink:#E5E7EB; --muted:#9CA3AF; --line:#2C303A; --head:#3B4252; --headwe:#2C303A;
  --accent:#9DB8E6; --shadow:0 1px 2px rgba(0,0,0,.4); --weekend:#1A1C21;
  --routine-bg:#22304A; --routine-fg:#B7CBEE; --bilan-bg:#2E2850; --bilan-fg:#CFC6FF; --ordi-bg:#173B37; --ordi-fg:#9EE3D8;
  --corvee-bg:#3D3016; --corvee-fg:#F2CF83; --courses-bg:#1B3A21; --courses-fg:#A6E3AF; --sport-bg:#46201D; --sport-fg:#F5B3AC;
  --travaux-bg:#43301F; --travaux-fg:#F1C29B; --loisir-bg:#3D2140; --loisir-fg:#EDB8E6; --soir-bg:#262E42; --soir-fg:#C3CDE6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.4 "Inter","Noto Sans",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.subtitle{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--card);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:1fr;gap:16px}
.layout.with-tasks{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:1100px){.layout.with-tasks{grid-template-columns:1fr}}
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal{position:relative;display:grid;grid-template-columns:58px repeat(7,minmax(118px,1fr));gap:4px;min-width:900px}
.dayhead{background:var(--head);color:#fff;border-radius:6px;text-align:center;font-weight:700;font-size:12px;letter-spacing:.06em;padding:6px 4px}
.dayhead.we{background:var(--headwe)}
.dayhead small{display:block;font-weight:500;letter-spacing:0;opacity:.8;font-size:10.5px}
.dayhead.today{outline:2px solid var(--accent);outline-offset:2px}
.time{min-height:var(--h,46px);color:var(--muted);font-weight:700;font-size:12px;text-align:right;padding:8px 6px 0 0;position:relative}
.time input{width:52px;text-align:right;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:2px 4px;font-weight:700;font-size:12px}
.rowtools{display:flex;gap:2px;justify-content:flex-end;margin-top:4px}
.rowtools button{border:none;background:none;cursor:pointer;color:var(--muted);padding:0 2px;font-size:12px}
.slot{min-height:var(--h,46px);border-radius:7px;position:relative}
.rz{position:absolute;left:0;right:0;bottom:-5px;height:9px;cursor:row-resize;z-index:3;touch-action:none}
.rz::after{content:"";position:absolute;left:35%;right:35%;top:3px;height:3px;border-radius:3px;background:var(--accent);opacity:0;transition:opacity .15s}
.rz:hover::after,.rz.drag::after{opacity:.8}
body.resizing{cursor:row-resize;user-select:none}
.slot.empty.we{background:var(--weekend)}
.edit .slot.empty{border:1px dashed var(--line);cursor:pointer}
.edit .slot.empty:hover{border-color:var(--accent)}
.block{height:100%;border-radius:7px;padding:7px 9px 7px 12px;position:relative;cursor:default;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.block::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--fg)}
.block.pause::before{display:none}
.block .t{font-weight:700;font-size:12.5px;color:var(--fg)}
.block .s{font-size:11px;color:var(--fg);opacity:.85;white-space:pre-line}
.edit .block{cursor:pointer;outline:1px dashed transparent}
.edit .block:hover{outline-color:var(--fg)}
.badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px;order:-1;margin:-2px -3px 1px 0}
.block.has-badge{justify-content:flex-start}
.badge{background:var(--fg);color:var(--bg);border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 7px;cursor:pointer;border:none}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav span{font-weight:700;min-width:170px;text-align:center}
.weeknav .btn{padding:5px 10px}
.dayhead .dnum{font-weight:500;opacity:.8;letter-spacing:0}
.badge.plan{background:var(--accent);color:var(--card)}
.dayplan{display:grid;gap:6px;margin-top:5px;font-size:11px;color:var(--fg);line-height:1.3}
.dp{min-width:0}
.dp .badge{margin-bottom:2px}
.dp .pi{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp .more{opacity:.7}
.zones{position:absolute;inset:0;display:grid;pointer-events:none;border-radius:7px;overflow:hidden}
body.dragging-task .zones{pointer-events:auto}
body.dragging-task .zone{border-left:1px dashed color-mix(in srgb, var(--fg) 35%, transparent)}
body.dragging-task .zone:first-child{border-left:none}
.zone.over{background:color-mix(in srgb, var(--accent) 22%, transparent);outline:2px dashed var(--accent);outline-offset:-2px}
.zone.over::after{content:attr(data-label);position:absolute;margin:4px 6px;font-size:10.5px;font-weight:700;color:var(--accent)}
.zone{position:relative}
.task.dragging{opacity:.4}
.task[draggable=true]{cursor:grab}
.task .unplan{border:none;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 8px;font-size:12px}
.task .unplan:hover{color:#C2410C}
.badge.proj{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.badge.zero{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;background:var(--bg);border-left:3px solid var(--fg)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
/* panneau tâches */
aside{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
aside h2{margin:0 0 2px;font-size:16px}
aside .meta{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.toggles{display:flex;flex-wrap:wrap;gap:4px 14px;margin:-4px 0 10px;font-size:12px;color:var(--muted)}
.toggles label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer}
.chip.on{background:var(--bg,var(--accent));color:var(--fg,#fff);border-color:var(--fg,var(--accent));font-weight:700}
.group h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);margin:12px 0 6px;display:flex;justify-content:space-between}
.task{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-left:3px solid var(--fg);border-radius:8px;padding:7px 9px;margin-bottom:6px;background:var(--paper)}
.task:hover{border-color:var(--fg)}
.task .tt{font-weight:600;font-size:13px}
.task .tm{font-size:11px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.task{cursor:pointer}
.task .tt{display:flex;align-items:baseline;gap:0}
.task .tl{flex:1}
.task .chev{color:var(--fg);width:14px;flex:none;font-size:11px}
.task .ob{color:var(--muted);text-decoration:none;padding:0 2px 0 8px;font-size:13px;flex:none}
.task .ob:hover{color:var(--fg)}
.subs{margin:7px 0 2px 14px;border-top:1px dashed var(--line);padding-top:6px}
.subh{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg);margin:6px 0 3px}
.sub{display:flex;gap:6px;font-size:12px;line-height:1.35;padding:2px 0}
.sub .box{flex:none;color:var(--fg)}
.sub.done{color:var(--muted);text-decoration:line-through}
.sub.muted{color:var(--muted)}
.task.blocked{opacity:.55}
.prio{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.p1{background:#E5484D}.p2{background:#F5A524}.p3{background:#30A46C}.p4{background:#A1A1AA}.p0{background:transparent;border:1px solid var(--muted)}
.empty-tasks{color:var(--muted);font-size:13px;padding:10px 0}
/* modale */
dialog{border:none;border-radius:14px;padding:0;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{padding:18px}
dialog h3{margin:0 0 12px}
dialog label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
dialog input[type=text],dialog select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--paper)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:inline-flex;align-items:center;gap:4px;margin:0;color:var(--ink);font-size:13px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;cursor:pointer}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.actions .danger{margin-right:auto;color:#C2410C}
.aside-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.aside-head .btn{padding:4px 10px;box-shadow:none}
dialog textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--paper);font:12.5px/1.4 ui-monospace,monospace;color:inherit;resize:vertical}
.set-row{display:flex;gap:8px;align-items:center}
.set-row code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.set-intro{background:var(--routine-bg);color:var(--routine-fg);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 6px}
.set-hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.sub.clic{cursor:pointer;border-radius:5px}
.sub.clic:hover{background:color-mix(in srgb, var(--fg) 10%, transparent)}
.nowline{position:absolute;height:0;pointer-events:none;z-index:6;border-top:1px dashed color-mix(in srgb, #E5484D 55%, transparent)}
.nowline .today{position:absolute;top:-2px;height:0;border-top:2.5px solid #E5484D;border-radius:2px}
.nowline .today::before{content:"";position:absolute;left:-5px;top:-6.5px;width:10px;height:10px;border-radius:50%;background:#E5484D}
.nowline .lbl{position:absolute;top:-9px;font-size:10.5px;font-weight:700;color:#fff;background:#E5484D;border-radius:6px;padding:1px 5px}
.task .done-btn{flex:none;width:16px;height:16px;border-radius:50%;border:1.8px solid var(--fg,var(--muted));background:transparent;margin:0 7px 0 0;padding:0;cursor:pointer;position:relative;top:2px}
.task .done-btn:hover{background:color-mix(in srgb, var(--fg) 25%, transparent)}
.task .done-btn:hover::after{content:"✓";position:absolute;inset:0;font-size:11px;line-height:13px;text-align:center;color:var(--fg)}
.task.validating{opacity:.35;text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 12px 9px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:50;font-size:13.5px}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:7px;padding:3px 10px;cursor:pointer;font:inherit}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog input[type=time]{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--paper);color:inherit;font:inherit}
.hours{position:relative}
.hours .hl{position:absolute;right:6px;transform:translateY(-7px);font-size:11.5px;font-weight:700;color:var(--muted)}
.col{position:relative;border-radius:7px;background-image:linear-gradient(to bottom, color-mix(in srgb, var(--line) 80%, transparent) 1px, transparent 1px);background-size:100% var(--hh)}
.col.we{background-color:var(--weekend)}
.col.today{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent)}
.evs{position:relative}
.ev{position:absolute;box-sizing:border-box;padding:1px 0;touch-action:none}
.ev .block{height:100%;cursor:grab;user-select:none;justify-content:flex-start}
.ev.short .block{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;padding:1px 8px 1px 12px}
.ev.short .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.short .s,.ev.short .dayplan{display:none}
.ev.short .block::before{top:3px;bottom:3px}
.ev .rz2{position:absolute;left:0;right:0;bottom:-3px;height:9px;cursor:ns-resize;z-index:4}
.ev .rz2::after{content:"";position:absolute;left:40%;right:40%;top:3px;height:3px;border-radius:3px;background:var(--fg);opacity:0;transition:opacity .15s}
.ev:hover .rz2::after,.ev.resizing .rz2::after{opacity:.7}
.ev .hold{position:absolute;left:4px;bottom:3px;height:3px;width:0;border-radius:3px;background:var(--fg);opacity:.8;z-index:3}
.ev.pressing .hold{width:calc(100% - 8px);transition:width 3s linear}
.ev.lifted{opacity:.35}
.ev.resizing{z-index:10}
.ghost{position:absolute;box-sizing:border-box;border:2px dashed var(--accent);border-radius:7px;background:color-mix(in srgb, var(--accent) 16%, transparent);pointer-events:none;z-index:15;font-size:11px;font-weight:700;color:var(--accent);padding:3px 6px}
.ghost.bad{border-color:#E5484D;color:#E5484D;background:color-mix(in srgb, #E5484D 14%, transparent)}
.tip{position:absolute;z-index:16;pointer-events:none;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;transform:translate(-50%,-130%)}
.plus{position:absolute;z-index:17;width:26px;height:26px;border-radius:50%;border:none;background:var(--accent);color:var(--card);font-size:18px;line-height:24px;cursor:pointer;transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.25);animation:pop .15s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4)}to{transform:translate(-50%,-50%) scale(1)}}
.hovering-hint{position:absolute;z-index:14;pointer-events:none;height:0;border-top:2px dotted var(--accent);opacity:.7}
.dayhead .dchip{display:inline-block;margin-left:6px;background:var(--card);color:var(--ink);border-radius:999px;font-size:10.5px;padding:0 6px;cursor:pointer}
body.dragging-ev,body.dragging-ev *{cursor:grabbing!important;user-select:none}
.hidden{display:none!important}
@media print{
  @page{size:A4 landscape;margin:9mm}
  :root{--paper:#fff}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar,aside,.note,.rowtools,.badge{display:none!important}
  .layout,.layout.with-tasks{grid-template-columns:1fr}
  .wrap{padding:0;max-width:none}
  .cal{min-width:0}
  .cal-scroll{overflow:visible}
  .slot{min-height:calc(var(--h,46px) * .8)}
  .rz{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Cadence</h1>
      <div class="subtitle" id="subtitle">Ta semaine type, reliée à tes tâches Obsidian</div>
    </div>
    <div class="weeknav"><button class="btn" id="wPrev" title="Semaine précédente">◀</button><span id="wLabel"></span><button class="btn" id="wNext" title="Semaine suivante">▶</button><button class="btn" id="wNow" title="Revenir à la semaine en cours">Auj.</button></div>
    <div class="toolbar">
      <button class="btn" id="btnTasks" title="Choisir le dossier des tâches TaskNotes du coffre">📂 Charger mes tâches</button>
      <button class="btn hidden" id="btnSettings" title="Coffre Obsidian, fichier de la semaine, tags et projets">⚙️ Réglages</button>
      <button class="btn" id="btnPrint">🖨️ Imprimer</button>
      <button class="btn" id="btnExport" title="Sauvegarder la semaine dans un fichier">💾 Exporter</button>
      <button class="btn" id="btnImport">📥 Importer</button>
      <button class="btn" id="btnClearPlan" title="Retirer toutes les tâches prévues (nouvelle semaine)">🧹 Vider la semaine</button>
      <button class="btn" id="btnTheme" title="Thème clair / sombre">🌓</button>
      <input type="file" id="dirInput" webkitdirectory directory multiple class="hidden">
      <input type="file" id="jsonInput" accept="application/json" class="hidden">
    </div>
  </header>

  <div class="layout" id="layout">
    <main>
      <div class="cal-scroll"><div class="cal" id="cal"></div></div>
      <div class="legend" id="legend"></div>
      <div class="note" id="note">Modifications enregistrées automatiquement dans ce navigateur. « Exporter » en garde une copie dans un fichier.</div>
    </main>
    <aside id="tasks" class="hidden">
      <div class="aside-head"><h2>Mes tâches</h2><button class="btn hidden" id="btnNewTask" title="Créer une tâche dans le coffre">＋ Tâche</button></div>
      <div class="meta" id="tasksMeta"></div>
      <div class="toggles">
        <label><input type="checkbox" id="hidePlaced"> Masquer les tâches placées</label>
        <label><input type="checkbox" id="hideBlocked"> Masquer les tâches bloquées</label>
        <label title="Tâches datées à plus de 30 jours"><input type="checkbox" id="hideLater"> Masquer les tâches lointaines (+30 j)</label>
        <label title="Tâches qui ont une date planifiée ou une échéance"><input type="checkbox" id="hideDated"> Masquer les tâches datées</label>
      </div>
      <div class="filters" id="filters"></div>
      <div id="taskList"></div>
    </aside>
  </div>
</div>

<dialog id="dlgNew">
  <form method="dialog" id="newForm">
    <h3>Nouvelle tâche</h3>
    <label for="nTitle">Titre</label>
    <input type="text" id="nTitle" autocomplete="off" required>
    <label for="nTag">Tag</label>
    <select id="nTag"></select>
    <label for="nProj">Projet</label>
    <select id="nProj"></select>
    <label for="nPrio">Priorité</label>
    <select id="nPrio"></select>
    <label for="nDay">Jour (facultatif)</label>
    <select id="nDay"></select>
    <label for="nTime">Heure (facultatif, ex. 14:00)</label>
    <input type="text" id="nTime" autocomplete="off" placeholder="14:00">
    <label for="nNote">Note (facultatif)</label>
    <input type="text" id="nNote" autocomplete="off">
    <div class="actions">
      <button type="button" class="btn" id="nCancel">Annuler</button>
      <button type="submit" class="btn on">Créer</button>
    </div>
  </form>
</dialog>

<dialog id="dlgSet">
  <form method="dialog" id="setForm">
    <h3>Réglages</h3>
    <p class="set-intro hidden" id="setIntro">Pour commencer, choisis le dossier de ton coffre Obsidian.</p>
    <label>Coffre Obsidian</label>
    <div class="set-row"><code id="sVault">—</code><button type="button" class="btn" id="sPick">Choisir…</button></div>
    <label for="sData">Fichier de la semaine type (dans le coffre)</label>

<script>
(() => {
'use strict';
const BUREAU = !!window.cadence;   // application de bureau Cadence (sinon : page ouverte dans un navigateur)
let VAULT = 'Obsidian', TASK_DIR = 'TaskNotes/Tasks/', TN = null, CFG = null;
const KEY = 'semaine-type-v1', TKEY = 'semaine-type-tasks-v1', THKEY = 'semaine-type-theme';
const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CATS = {routine:'Routine', sport:'Sport', bilan:'Travail concentré', ordi:'Ordi', corvee:'Corvées', courses:'Courses / cuisine', travaux:'Travaux', loisir:'Loisirs', soir:'Soir', pause:'Pause (discret)'};
// Tags et projets : définis dans les réglages (enregistrés avec la semaine), complétés par ceux trouvés dans les tâches
const tagDefs = () => (state && state.tags) || [];
const projDefs = () => (state && state.projects) || [];
const projNames = () => projDefs().map(p => p.name);
function tagsObj(){
  const o = {'': 'Aucune'};
  tagDefs().forEach(t => { o[t.name] = t.label || t.name; });
  if (tasks) tasks.items.forEach(x => x.tags.forEach(n => { if (n !== 'Aucun' && !(n in o)) o[n] = n; }));
  return o;
}
const catOf = (v) => v && v.startsWith('p:') ? ((projDefs().find(p => p.name === v.slice(2)) || {}).cat || 'routine') : (tagDefs().find(t => t.name === v) || {}).cat;
const H = (h, m = 0) => h * 60 + m;
const E = (d, start, end, title, cat, sub = '', tag = '', project = '') => ({d, start, end, title, cat, sub, tag, project});
const W5E = (start, end, title, cat, sub) => [0,1,2,3,4].map(d => E(d, start, end, title, cat, sub));
const DEFAULT = {
  events: [
    ...W5E(H(7), H(8), 'Routine du matin', 'routine', 'lever, sport, petit-déjeuner'),
    ...W5E(H(9), H(12), 'Travail concentré', 'bilan', ''),
    ...W5E(H(12), H(13,30), 'Pause déjeuner', 'pause', ''),
    ...W5E(H(13,30), H(14), 'Tâches ordi / en ligne', 'ordi', ''),
    E(0, H(14), H(18), 'Courses', 'courses', 'une seule sortie'),
    E(1, H(14), H(15), 'Sport', 'sport'), E(1, H(15), H(18), 'Travaux', 'travaux'),
    E(2, H(14), H(18), 'Loisir', 'loisir'),
    E(3, H(14), H(15), 'Sport', 'sport'), E(3, H(15), H(18), 'Travaux', 'travaux'),
    E(4, H(14), H(18), 'Projet perso', 'travaux'),
    E(5, H(17), H(18), 'Revue de la semaine', 'routine', 'trier et placer les tâches'),
    ...W5E(H(21), H(22), 'Routine du soir', 'soir', 'ranger, préparer demain, lecture'),
  ],
  weekendNote: 'libre',
  tags: [],
  projects: [],
  v: 4
};

const $ = (s) => document.querySelector(s);
const clone = (o) => JSON.parse(JSON.stringify(o));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let state = (() => { try { const s = JSON.parse(store.get(KEY)); if (s && (Array.isArray(s.events) || Array.isArray(s.rows))) return s; } catch(e){} return clone(DEFAULT); })();
let tasks = BUREAU ? null : (() => { try { const t = JSON.parse(store.get(TKEY)); if (t && Array.isArray(t.items)) return t; } catch(e){} return null; })();
let filter = '', dragFile = null;
const HKEY = 'semaine-type-hide-v1';
let hide = (() => { try { return Object.assign({placed:false, blocked:false, later:true, dated:false}, JSON.parse(store.get(HKEY)) || {}); } catch(e){ return {placed:false, blocked:false, later:true, dated:false}; } })();
const LATER_DAYS = 30;
const isLater = (t) => { const src = (t.scheduled || t.due || '').slice(0, 10); if (!src) return false; const lim = new Date(); lim.setDate(lim.getDate() + LATER_DAYS); return src > isoOf(lim); };
const expanded = new Set();
const rid = () => Math.random().toString(36).slice(2, 9);
let minuteurPersist = null;
function persist(){
  if (!BUREAU || !CFG || !CFG.coffre) return;
  clearTimeout(minuteurPersist);
  minuteurPersist = setTimeout(() => cadence.ecrireDonnees({format: 'cadence/1', semaine: state, plan, masquer: hide})
    .catch(e => alert('Enregistrement impossible : ' + messageErreur(e))), 400);
}
const messageErreur = (e) => String(e && e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, '');
// Ancien format (lignes + cellules + durée en lignes) → blocs avec début et fin, en minutes
function migrer(){
  if (Array.isArray(state.events)) return false;
  const rows = state.rows || [], ev = [];
  const covered = rows.map(() => Array(7).fill(false));
  const spanOf = (r, c) => Math.max(1, Math.min(c && c.span || 1, rows.length - r));
  rows.forEach((row, r) => (row.cells || []).forEach((c, d) => {
    if (!c || covered[r][d]) return;
    const sp = spanOf(r, c); for (let k = 1; k < sp; k++) covered[r + k][d] = true;
    let start = tmin(row.time), end;
    if (start == null) return;
    const last = tmin(rows[r + sp - 1].time), nxt = rows[r + sp] ? tmin(rows[r + sp].time) : null;
    end = nxt != null ? (nxt - last > 90 ? last + 60 : nxt) : start + 30;
    const m = String(c.sub || '').match(/(\d{1,2})\s*h\s*(\d{2})?\s*[–-]\s*(\d{1,2})\s*h\s*(\d{2})?/);
    if (m){ start = H(+m[1], +(m[2] || 0)); end = H(+m[3], +(m[4] || 0)); }
    const sub = String(c.sub || '').replace(/(\d{1,2})\s*h\s*(\d{2})?\s*[–-]\s*(\d{1,2})\s*h\s*(\d{2})?/g, '').replace(/\s*·\s*/g, ' · ').split('\n').map(x => x.replace(/^[\s·,;:–-]+|[\s·,;:–-]+$/g, '')).filter(Boolean).join(' · ');
    if (end <= start) end = start + 30;
    ev.push({id: rid(), d, start, end, title: c.title || '', cat: c.cat || 'routine', sub, tag: c.tag || '', project: c.project || ''});
  }));
  state.events = ev; state.rowsV3 = rows; delete state.rows; state.v = 4; plan = {};
  return true;
}
const ensureIds = () => { const m = migrer(); let c = false; state.events.forEach(e => { if (!e.id){ e.id = rid(); c = true; } }); return m || c; };
const save = () => { if (BUREAU) persist(); else store.set(KEY, JSON.stringify(state)); };

const PKEY = 'semaine-type-plan-v1';
let plan = (() => { try { const p = JSON.parse(store.get(PKEY)); if (p && typeof p === 'object') return p; } catch(e){} return {}; })();
const savePlan = () => { if (BUREAU) persist(); else store.set(PKEY, JSON.stringify(plan)); };
const saveHide = () => { if (BUREAU) persist(); else store.set(HKEY, JSON.stringify(hide)); };
const whereIs = (file) => Object.keys(plan).find(k => plan[k].includes(file));
const fmtMin = (m) => `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`;
const evById = (id) => state.events.find(e => e.id === id);
const keyLabel = (k) => { if (k.startsWith('day:')) return DAYS[+k.slice(4)]; const e = evById(k); return e ? `${DAYS[e.d]} ${fmtMin(e.start)}` : '?'; };
const plannedFiles = (k) => (plan[k] || []).filter(f => !tasks || tasks.items.some(t => t.file === f));
function planTask(file, k){
  Object.keys(plan).forEach(x => { plan[x] = plan[x].filter(f => f !== file); if (!plan[x].length) delete plan[x]; });
  if (k) (plan[k] = plan[k] || []).push(file);
  savePlan(); render();
}

/* ---------- thème ---------- */
const applyTheme = (t) => { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); };
applyTheme(store.get(THKEY));
$('#btnTheme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.getAttribute('data-theme') || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; applyTheme(next); store.set(THKEY, next);
};

/* ---------- tâches ---------- */
const sameEv = (a,b) => a && b && a.start===b.start && a.end===b.end && a.title===b.title && a.sub===b.sub && a.cat===b.cat && (a.tag||'')===(b.tag||'') && (a.project||'')===(b.project||'');
const readyProject = (p) => tasks ? tasks.items.filter(t => (t.projects||[]).includes(p) && !t.blocked && !isLater(t)).length : 0;
const readyCount = (tag) => tasks ? tasks.items.filter(t => t.tags.includes(tag) && !t.blocked && !isLater(t)).length : 0;
let weekOffset = 0, dated = {}, weekDays = [];
const isoOf = (x) => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
function weekDates(){
  const t = new Date(); t.setHours(12,0,0,0);
  const dow = (t.getDay() + 6) % 7;                       // le week-end, on montre la semaine qui vient
  const mon = new Date(t); mon.setDate(t.getDate() - dow + (dow >= 5 ? 7 : 0) + 7 * weekOffset);
  return [...Array(7)].map((_, i) => { const x = new Date(mon); x.setDate(mon.getDate() + i); return x; });
}
const tmin = (s) => { const m = String(s).match(/(\d{1,2})\s*[h:]\s*(\d{2})?/); return m ? (+m[1]) * 60 + (+(m[2] || 0)) : null; };
function computeDated(){
  dated = {}; if (!tasks || !state.events) return;
  const isos = weekDays.map(isoOf);
  tasks.items.forEach(t => {
    const src = t.scheduled || t.due; if (!src) return;
    const d = isos.indexOf(src.slice(0, 10)); if (d < 0 || whereIs(t.file)) return;
    const tm = src.length > 10 ? tmin(src.slice(11)) : null, day = state.events.filter(e => e.d === d);
    let e = null;
    if (tm != null) e = day.find(x => x.start <= tm && tm < x.end) || null;
    if (!e && tm == null) e = day.find(x => x.tag && t.tags.includes(x.tag)) || null;
    const k = e ? e.id : 'day:' + d;
    (dated[k] = dated[k] || []).push(t.file);
  });
}
const dayFiles = (k) => plannedFiles(k).concat(dated[k] || []);

function parseTask(name, text){
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return null;
  const fm = m[1].split(/\r?\n/), body = m[2];
  const o = {}; let cur = null;
  for (const line of fm){
    const kv = line.match(/^([^\s#-][^:]*):\s*(.*)$/);
    if (kv){ cur = kv[1].trim(); let v = kv[2].trim();
      if (/^\[.*\]$/.test(v)) o[cur] = v.slice(1,-1).split(',').map(x=>x.trim().replace(/^["']|["']$/g,'')).filter(Boolean);
      else o[cur] = v.replace(/^["']|["']$/g,'');
      continue; }
    const li = line.match(/^\s+-\s+(.*)$/);
    if (li && cur){ if (!Array.isArray(o[cur])) o[cur] = []; o[cur].push(li[1].trim().replace(/^["']|["']$/g,'')); }
    const uid = line.match(/^\s+(?:-\s+)?uid:\s*"?\[\[(.*?)\]\]"?/);
    if (uid && cur === 'blockedBy'){ (o._blocked = o._blocked || []).push(uid[1]); }
  }
  const rawTags = Array.isArray(o.tags) ? o.tags : (o.tags ? [o.tags] : []);
  if (!estTache(o, rawTags)) return null;
  if (statutTermine(o.status || '')) return null;
  const tags = rawTags.filter(t => t !== 'archived' && !(TN && TN.methode === 'tag' && t === TN.tag));
  const boxes = [...body.matchAll(/^\s*- \[( |x|X)\]/gm)];
  const subs = []; let head = '';
  for (const line of body.split(/\r?\n/)){
    const h = line.match(/^#{1,6}\s+(.*)$/); if (h){ head = cleanMd(h[1]); continue; }
    const c = line.match(/^\s*- \[( |x|X)\]\s*(.*)$/);
    if (c) subs.push({h: head, done: c[1] !== ' ', text: cleanMd(c[2]), i: subs.length});
  }
  const projects = (Array.isArray(o.projects) ? o.projects : (o.projects ? [o.projects] : []))
    .map(p => p.replace(/^\+?\[\[|\]\]$/g, '').split('|')[0].trim()).filter(Boolean);
  return {
    subs, projects,
    file: name.replace(/\.md$/,''), title: o.title && o.title !== '""' ? o.title : name.replace(/\.md$/,''),
    tags: tags.length ? tags : ['Aucun'], priority: o.priority || '', status: o.status || '',
    scheduled: o.scheduled || '', due: o.due || '', recurring: !!o.recurrence,
    blockedBy: o._blocked || [], boxes: boxes.length, done: boxes.filter(b => b[1] !== ' ').length
  };
}
const sansGuillemets = (v) => String(v || '').replace(/^["']+|["']+$/g, '').trim();
function estTache(o, tags){
  if (!TN) return 'status' in o || tags.includes('task');            // navigateur : heuristique simple
  if (TN.methode === 'property' && TN.propriete){
    const v = o[TN.propriete], att = sansGuillemets(TN.valeur);
    return (Array.isArray(v) ? v : [v]).some(x => sansGuillemets(x) === att);
  }
  return tags.includes(TN.tag || 'task');
}
function statutTermine(st){
  const v = sansGuillemets(st).toLowerCase();
  if (TN && TN.statuts && TN.statuts.length) return TN.statuts.some(s => s.termine && String(s.valeur).toLowerCase() === v);
  return v === 'done' || v === 'completed';
}
function cleanMd(s){
  return s.replace(/\s*🆔\s*\S+/g, '').replace(/!\[\[[^\]]*\]\]/g, '')
          .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2').replace(/\[\[([^\]]+)\]\]/g, '$1')
          .replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\s+/g, ' ').trim();
}
function resolveBlocked(items){
  const open = new Set(items.map(t => t.file));
  items.forEach(t => { t.waitingOn = t.blockedBy.filter(b => open.has(b)); t.blocked = t.waitingOn.length > 0; });
  return items;
}
$('#btnTasks').onclick = () => $('#dirInput').click();
$('#dirInput').onchange = async (e) => {
  const files = [...e.target.files].filter(f => f.name.endsWith('.md') && !f.name.includes('sync-conflict'));
  const items = [];
  for (const f of files){ try { const t = parseTask(f.name, await f.text()); if (t) items.push(t); } catch(err){} }
  tasks = {loadedAt: new Date().toISOString(), items: resolveBlocked(items)};
  store.set(TKEY, JSON.stringify(tasks));
  e.target.value = '';
  render();
};

/* ---------- rendu calendrier : agenda à l'heure réelle ---------- */
const PXH = 54;                                    // pixels par heure
const SNAP = 15;                                   // pas de 15 minutes
let RS = 7 * 60, RE = 22 * 60;                     // plage affichée (recalculée)
const snap = (m) => Math.round(m / SNAP) * SNAP;
const yOf = (m) => (m - RS) / 60 * PXH;
const dayEvents = (d) => state.events.filter(e => e.d === d).sort((a, b) => a.start - b.start);
const chevauche = (d, start, end, ignore = []) => state.events.some(e => e.d === d && !ignore.includes(e.id) && e.start < end && start < e.end);

function render(){ renderCal(); renderTasks(); }

function renderCal(){
  const cal = $('#cal'); cal.innerHTML = '';
  weekDays = weekDates(); computeDated();
  const todayIso = isoOf(new Date());
  $('#wLabel').textContent = `Semaine du ${weekDays[0].toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}`;
  RS = Math.min(7 * 60, ...state.events.map(e => Math.floor(e.start / 60) * 60));
  RE = Math.max(22 * 60, ...state.events.map(e => Math.ceil(e.end / 60) * 60));
  const HT = (RE - RS) / 60 * PXH;
  cal.appendChild(document.createElement('div'));
  DAYS.forEach((d, i) => {
    const dd = weekDays[i], h = document.createElement('div'); h.className = 'dayhead' + (i >= 5 ? ' we' : '') + (isoOf(dd) === todayIso ? ' today' : '');
    h.innerHTML = `${d.toUpperCase()} <span class="dnum">${dd.getDate()}/${String(dd.getMonth() + 1).padStart(2, '0')}</span>` + (i >= 5 && state.weekendNote ? `<small>${esc(state.weekendNote)}</small>` : '');
    const hors = dated['day:' + i] || [];
    if (hors.length){ const c = document.createElement('span'); c.className = 'dchip'; c.textContent = '📅 ' + hors.length; c.title = 'Tâches datées ce jour, hors créneau';
      c.onclick = () => { filter = '@plan:day:' + i; renderTasks(); }; h.appendChild(c); }
    cal.appendChild(h);
  });
  // graduation des heures
  const hours = document.createElement('div'); hours.className = 'hours'; hours.style.height = HT + 'px'; hours.style.gridRow = '2'; hours.style.gridColumn = '1';
  for (let m = RS; m <= RE; m += 60){ const l = document.createElement('div'); l.className = 'hl'; l.style.top = yOf(m) + 'px'; l.textContent = fmtMin(m); hours.appendChild(l); }
  cal.appendChild(hours);
  // colonnes des jours
  for (let i = 0; i < 7; i++){
    const c = document.createElement('div'); c.className = 'col' + (i >= 5 ? ' we' : '') + (isoOf(weekDays[i]) === todayIso ? ' today' : '');
    c.style.gridRow = '2'; c.style.gridColumn = String(i + 2); c.style.height = HT + 'px'; c.style.setProperty('--hh', PXH + 'px');
    c.style.backgroundPosition = `0 ${yOf(Math.ceil(RS / 60) * 60)}px`;
    cal.appendChild(c);
  }
  // calque des blocs (au-dessus des 7 colonnes)
  const evs = document.createElement('div'); evs.className = 'evs'; evs.id = 'evs';
  evs.style.gridRow = '2'; evs.style.gridColumn = '2 / 9'; evs.style.height = HT + 'px';
  cal.appendChild(evs);
  // regroupement des jours consécutifs identiques (effet fusion)
  const vus = new Set();
  for (let d = 0; d < 7; d++) dayEvents(d).forEach(e => {
    if (vus.has(e.id)) return;
    const grp = [e]; vus.add(e.id);
    for (let k = d + 1; k < 7; k++){ const n = dayEvents(k).find(x => !vus.has(x.id) && sameEv(x, e)); if (!n) break; grp.push(n); vus.add(n.id); }
    evs.appendChild(evElement(grp));
  });
  installerAgenda(evs);
  const lg = $('#legend'); lg.innerHTML = '';
  Object.entries(CATS).filter(([k]) => k !== 'pause').forEach(([k,v]) => {
    const s = document.createElement('span'); s.innerHTML = `<i style="--bg:var(--${k}-bg);--fg:var(--${k}-fg)"></i>${v}`; lg.appendChild(s);
  });
  drawNow();
}

const colX = (d) => `calc((100% - 24px) / 7 * ${d} + ${4 * d}px)`;
const colW = (n) => `calc((100% - 24px) / 7 * ${n} + ${4 * (n - 1)}px)`;

function evElement(grp){
  const e = grp[0], nd = grp.length, dur = e.end - e.start, h = dur / 60 * PXH;
  const el = document.createElement('div'); el.className = 'ev' + (h < 40 ? ' short' : '');
  el.style.top = yOf(e.start) + 'px'; el.style.height = h + 'px'; el.style.left = colX(e.d); el.style.width = colW(nd);
  el.dataset.ids = grp.map(x => x.id).join(',');
  const b = document.createElement('div'); b.className = 'block ' + e.cat;
  b.style.setProperty('--bg', `var(--${e.cat}-bg)`); b.style.setProperty('--fg', `var(--${e.cat}-fg)`); b.style.background = 'var(--bg)';
  el.style.setProperty('--fg', `var(--${e.cat}-fg)`);
  b.innerHTML = `<div class="t">${esc(e.title)}</div><div class="s">${fmtMin(e.start)} – ${fmtMin(e.end)}${e.sub ? ' · ' + esc(e.sub) : ''}</div>`;
  b.title = `${e.title} · ${fmtMin(e.start)} – ${fmtMin(e.end)}\nDouble-clic : modifier · bas du bloc : étirer · appui 3 s : déplacer`;
  if (tasks && (e.tag || e.project)){
    const wrap = document.createElement('div'); wrap.className = 'badges';
    const mkBadge = (n, label, val, proj) => {
      const bd = document.createElement('button'); bd.className = 'badge' + (proj ? ' proj' : '') + (n ? '' : ' zero');
      bd.textContent = (proj ? '📁 ' : '') + n; bd.title = `${n} tâche(s) prête(s) · ${label}`;
      bd.onclick = (ev) => { ev.stopPropagation(); filter = val; renderTasks(); $('#tasks').scrollIntoView({behavior:'smooth', block:'nearest'}); };
      wrap.appendChild(bd);
    };

/* ---------- interactions : étirer, déplacer (appui 3 s), « + » au survol, créneau ouvert en glissant une tâche ---------- */
function posAgenda(evs, x, y){
  const r = evs.getBoundingClientRect();
  const cw = (r.width - 24) / 7, px = x - r.left, py = y - r.top;
  const d = Math.max(0, Math.min(6, Math.floor(px / (cw + 4))));
  const m = RS + py / PXH * 60;
  return {d, m, px, py, r, cw, inside: px >= 0 && py >= 0 && px <= r.width && py <= r.height};
}
const groupOf = (el) => (el.dataset.ids || '').split(',').map(evById).filter(Boolean);
const mins2y = (m) => yOf(m) + 'px';

function ghost(evs, d, start, end, n, bad){
  let g = evs.querySelector('.ghost'); if (!g){ g = document.createElement('div'); g.className = 'ghost'; evs.appendChild(g); }
  g.classList.toggle('bad', !!bad);
  g.style.left = colX(d); g.style.width = colW(n || 1); g.style.top = mins2y(start); g.style.height = ((end - start) / 60 * PXH) + 'px';
  g.textContent = `${fmtMin(start)} – ${fmtMin(end)}` + (bad ? ' · chevauchement' : '');
}
const clearGhost = (evs) => evs.querySelectorAll('.ghost').forEach(g => g.remove());

// Créer un créneau à (jour, minute). Si on est pile entre deux blocs collés, on « ouvre » 30 min en décalant la suite.
function ouvrirCreneau(d, m, titre, ouvrirDialogue){
  m = snap(m);
  const day = dayEvents(d), dedans = day.find(e => e.start < m && m < e.end);
  if (dedans) return null;
  const suivant = day.find(e => e.start >= m);
  let end = Math.min(m + 60, suivant ? suivant.start : 24 * 60);
  if (end - m < SNAP){
    const decal = 30, aDecaler = day.filter(e => e.start >= m);
    if (aDecaler.some(e => e.end + decal > 24 * 60)){ toast('Pas de place pour ouvrir un créneau ici.'); return null; }
    aDecaler.forEach(e => { e.start += decal; e.end += decal; });
    end = m + decal;
  }
  const e = {id: rid(), d, start: m, end, title: titre || 'Nouveau créneau', cat: 'routine', sub: '', tag: '', project: ''};
  state.events.push(e); save(); renderCal();
  if (ouvrirDialogue) openDlg([e]);
  return e;
}

function installerAgenda(evs){
  // --- étirer (bas du bloc) et déplacer (appui long) ---
  evs.querySelectorAll('.ev').forEach(el => {
    const grp = groupOf(el);
    el.querySelector('.block').addEventListener('dblclick', (ev) => { ev.stopPropagation(); openDlg(grp); });
    el.querySelector('.rz2').addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      const e0 = grp[0], limite = Math.min(24 * 60, ...grp.map(g => { const n = dayEvents(g.d).find(x => x.start >= g.end && x.id !== g.id); return n ? n.start : 24 * 60; }));
      let fin = e0.end; el.classList.add('resizing'); try { ev.target.setPointerCapture(ev.pointerId); } catch(_){}
      const tip = document.createElement('div'); tip.className = 'tip'; evs.appendChild(tip);
      const move = (mv) => {
        const p = posAgenda(evs, mv.clientX, mv.clientY);
        fin = Math.max(e0.start + SNAP, Math.min(limite, snap(p.m)));
        el.style.height = ((fin - e0.start) / 60 * PXH) + 'px';
        tip.style.left = (p.px) + 'px'; tip.style.top = mins2y(fin); tip.textContent = `jusqu'à ${fmtMin(fin)}`;
      };
      const up = () => {
        ev.target.removeEventListener('pointermove', move); ev.target.removeEventListener('pointerup', up); ev.target.removeEventListener('pointercancel', up);
        tip.remove(); el.classList.remove('resizing');
        if (fin !== e0.end){ grp.forEach(g => g.end = fin); save(); }
        renderCal();
      };
      ev.target.addEventListener('pointermove', move); ev.target.addEventListener('pointerup', up); ev.target.addEventListener('pointercancel', up);
    });
    el.addEventListener('pointerdown', (ev) => {
      if (ev.button !== 0 || ev.target.closest('.rz2') || ev.target.closest('button')) return;
      const x0 = ev.clientX, y0 = ev.clientY, p0 = posAgenda(evs, x0, y0);
      const presse = grp.find(g => g.d === p0.d) || grp[0];
      let leve = false, cible = null;
      el.classList.add('pressing');
      const timer = setTimeout(() => { leve = true; el.classList.remove('pressing'); el.classList.add('lifted'); document.body.classList.add('dragging-ev'); }, 3000);
      const decalM = p0.m - presse.start;
      const move = (mv) => {
        if (!leve){ if (Math.hypot(mv.clientX - x0, mv.clientY - y0) > 6) fin(); return; }
        const p = posAgenda(evs, mv.clientX, mv.clientY), dur = presse.end - presse.start;
        let start = Math.max(0, Math.min(24 * 60 - dur, snap(p.m - decalM)));
        const memeJour = p.d === presse.d && grp.length > 1;
        const lot = memeJour ? grp : [presse], ids = lot.map(g => g.id);
        const jours = memeJour ? grp.map(g => g.d) : [p.d];
        const bad = jours.some(j => chevauche(j, start, start + dur, ids));
        cible = {d: p.d, start, dur, memeJour, bad, lot};
        ghost(evs, memeJour ? grp[0].d : p.d, start, start + dur, memeJour ? grp.length : 1, bad);
      };
      const fin = () => {
        clearTimeout(timer); el.classList.remove('pressing', 'lifted'); document.body.classList.remove('dragging-ev');
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', lacher);
      };
      const lacher = () => {
        fin(); clearGhost(evs);
        if (!leve || !cible) return;
        if (cible.bad){ toast('Chevauchement : déplacement refusé.'); return; }
        if (cible.memeJour) cible.lot.forEach(g => { g.start = cible.start; g.end = cible.start + cible.dur; });
        else { presse.d = cible.d; presse.start = cible.start; presse.end = cible.start + cible.dur; }
        save(); renderCal();
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', lacher);
    });
  });

  // --- « + » qui apparaît après 3 s de survol entre deux créneaux (ou dans un espace libre) ---
  let tSurvol = null, ptSurvol = null;
  const cachePlus = () => { clearTimeout(tSurvol); evs.querySelectorAll('.plus,.hovering-hint').forEach(x => x.remove()); };
  const pointLibre = (p) => {
    const day = dayEvents(p.d);
    for (const e of day){                                  // près d'un bord de bloc : on s'y aligne
      for (const bord of [e.start, e.end]) if (Math.abs(yOf(bord) - p.py) <= 6) return bord;
    }
    const m = snap(p.m);
    return day.some(e => e.start < m && m < e.end) ? null : m;
  };
  evs.parentElement.onpointermove = (ev) => {
    if (document.body.classList.contains('dragging-ev') || ev.buttons) return;
    if (ev.target.closest('.plus')) return;
    const p = posAgenda(evs, ev.clientX, ev.clientY);
    if (!p.inside){ cachePlus(); return; }
    if (ptSurvol && Math.hypot(ev.clientX - ptSurvol.x, ev.clientY - ptSurvol.y) < 6) return;
    cachePlus(); ptSurvol = {x: ev.clientX, y: ev.clientY};
    const m = pointLibre(p); if (m == null) return;
    tSurvol = setTimeout(() => {
      const b = document.createElement('button'); b.className = 'plus'; b.textContent = '+'; b.title = `Nouveau créneau ${DAYS[p.d]} à ${fmtMin(m)}`;
      b.style.left = `calc(${colX(p.d)} + ${p.cw / 2}px)`; b.style.top = mins2y(m);
      b.onclick = (e) => { e.stopPropagation(); cachePlus(); ouvrirCreneau(p.d, m, '', true); };
      const hint = document.createElement('div'); hint.className = 'hovering-hint'; hint.style.left = colX(p.d); hint.style.width = colW(1); hint.style.top = mins2y(m);
      evs.append(hint, b);
    }, 3000);
  };;
  evs.parentElement.onpointerleave = () => { cachePlus(); ptSurvol = null; };

  // --- glisser une tâche : dépôt sur un bloc ou une heure ; maintenue 3 s entre deux créneaux, elle en ouvre un ---
  let tTache = null, ptTache = null;
  const zone = evs.parentElement;
  zone.ondragover = (ev) => {
    if (!dragFile) return;
    ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
    const p = posAgenda(evs, ev.clientX, ev.clientY); if (!p.inside) return;
    const m = snap(p.m), e = dayEvents(p.d).find(x => x.start <= m && m < x.end);
    if (e) ghost(evs, p.d, e.start, e.end, 1, false); else ghost(evs, p.d, m, m + SNAP, 1, false);
    if (ptTache && Math.hypot(ev.clientX - ptTache.x, ev.clientY - ptTache.y) < 8) return;
    clearTimeout(tTache); ptTache = {x: ev.clientX, y: ev.clientY};
    const libre = pointLibre(p);
    if (libre == null) return;
    tTache = setTimeout(() => {
      const t = tasks && tasks.items.find(x => x.file === dragFile);
      const n = ouvrirCreneau(p.d, libre, t ? (tagsObj()[t.tags[0]] || t.title) : 'Créneau', false);
      if (n && t && t.tags[0] && tagDefs().some(x => x.name === t.tags[0])){ n.tag = t.tags[0]; n.cat = catOf(t.tags[0]) || 'routine'; save(); renderCal(); }
      if (n) toast(`Créneau ouvert ${DAYS[p.d]} à ${fmtMin(n.start)} : dépose la tâche dessus.`);
    }, 3000);
  };
  zone.ondragleave = (ev) => { if (!zone.contains(ev.relatedTarget)){ clearTimeout(tTache); ptTache = null; clearGhost(evs); } };
  zone.ondrop = (ev) => {
    ev.preventDefault(); clearTimeout(tTache); ptTache = null; clearGhost(evs);
    const f = ev.dataTransfer.getData('text/plain') || dragFile; dragFile = null; document.body.classList.remove('dragging-task');
    if (!f) return;
    const p = posAgenda(evs, ev.clientX, ev.clientY), m = snap(p.m);
    const e = dayEvents(p.d).find(x => x.start <= m && m < x.end);
    deposer(f, p.d, e ? e.start : m, e ? e.id : null);
  };
}

function prioN(p){

  [...known].forEach(p => fProj.add(new Option('📁 ' + p, p)));
  fProj.value = e.project || '';
  $('#fStart').value = hhmm(e.start); $('#fEnd').value = hhmm(e.end);
  const fd = $('#fDays'); fd.innerHTML = '';
  const days = grp.map(g => g.d);
  DAYS.forEach((d,i) => { const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" value="${i}" ${days.includes(i)?'checked':''}>${d.slice(0,3)}`; fd.appendChild(l); });
  $('#dDelete').classList.remove('hidden');
  $('#dlg').showModal(); $('#fTitle').focus(); $('#fTitle').select();
}
$('#dlgForm').onsubmit = (ev) => {
  ev.preventDefault();
  const grp = dlgCtx.grp, ids = grp.map(g => g.id);
  const start = tmin($('#fStart').value), end = tmin($('#fEnd').value);
  if (start == null || end == null || end <= start){ alert('Heures invalides : la fin doit être après le début.'); return; }
  const chosen = [...$('#fDays').querySelectorAll('input:checked')].map(i => +i.value);
  if (!chosen.length){ alert('Choisis au moins un jour.'); return; }
  const gene = chosen.find(d => chevauche(d, start, end, ids));
  if (gene != null){ alert(`Chevauchement le ${DAYS[gene]} : modifie l'heure ou le jour.`); return; }
  const val = {title: $('#fTitle').value.trim(), sub: $('#fSub').value.trim(), cat: fCat.value, tag: fTag.value, project: $('#fProj').value, start, end};
  state.events = state.events.filter(x => !(ids.includes(x.id) && !chosen.includes(x.d)));
  chosen.forEach(d => { const ex = grp.find(g => g.d === d); if (ex) Object.assign(ex, val); else state.events.push({id: rid(), d, ...val}); });
  save(); $('#dlg').close(); renderCal();
};
$('#dDelete').onclick = () => { const ids = dlgCtx.grp.map(g => g.id); state.events = state.events.filter(x => !ids.includes(x.id)); save(); $('#dlg').close(); renderCal(); };
$('#dCancel').onclick = () => $('#dlg').close();
$('#btnPrint').onclick = () => { render(); setTimeout(() => window.print(), 50); };

/* ---------- export / import ---------- */
$('#btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'semaine-type.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#hidePlaced').checked = hide.placed; $('#hideBlocked').checked = hide.blocked; $('#hideLater').checked = hide.later;
$('#hideDated').checked = !!hide.dated;
$('#hideDated').onchange = (e) => { hide.dated = e.target.checked; saveHide(); renderTasks(); };
$('#hideLater').onchange = (e) => { hide.later = e.target.checked; saveHide(); renderTasks(); };
$('#hidePlaced').onchange = (e) => { hide.placed = e.target.checked; saveHide(); renderTasks(); };
$('#hideBlocked').onchange = (e) => { hide.blocked = e.target.checked; saveHide(); renderTasks(); };
$('#wPrev').onclick = () => { weekOffset--; render(); };
$('#wNext').onclick = () => { weekOffset++; render(); };
$('#wNow').onclick = () => { weekOffset = 0; render(); };
$('#btnClearPlan').onclick = () => { if (confirm('Retirer toutes les tâches prévues dans la semaine ?')){ plan = {}; savePlan(); if (filter.startsWith('@plan:')) filter = ''; render(); } };
$('#btnImport').onclick = () => $('#jsonInput').click();
$('#jsonInput').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { let s = JSON.parse(await f.text()); if (s && s.semaine) s = s.semaine; if (!Array.isArray(s.events) && !Array.isArray(s.rows)) throw 0; state = s; ensureIds(); save(); render(); }
  catch(err){ alert('Fichier non reconnu.'); }
  e.target.value = '';
};
/* ---------- application de bureau : pont vers le coffre ---------- */
async function ecrire(fn){
  try { await fn(); } catch(e){ alert(messageErreur(e)); }
  await chargerTaches();
}
let toastTimer = null;
function toast(msg, action, fn){
  document.querySelectorAll('.toast').forEach(x => x.remove()); clearTimeout(toastTimer);
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action){ const b = document.createElement('button'); b.textContent = action; b.onclick = () => { el.remove(); fn(); }; el.appendChild(b); }
  document.body.appendChild(el); toastTimer = setTimeout(() => el.remove(), 7000);
}
async function valider(t){
  let res;
  try { res = await cadence.terminer(t.file, t.mtime); }
  catch(e){ alert(messageErreur(e)); await chargerTaches(); return; }
  await chargerTaches();
  toast(`✓ « ${t.title} » validée`, 'Annuler', () => ecrire(() => cadence.rouvrir(t.file, res.ancien)));
}
async function deposer(file, d, m, evId){
  if (!BUREAU){ if (evId) planTask(file, evId); return; }
  const t = tasks && tasks.items.find(x => x.file === file); if (!t) return;
  if (t.recurring){ alert('Tâche récurrente : change sa date dans TaskForge ou Obsidian.'); return; }
  const valeur = `${isoOf(weekDays[d])}T${hhmm(m)}`;
  if (whereIs(file)) planTask(file, null);
  await ecrire(() => cadence.planifier(file, valeur, t.mtime));
}
async function chargerConfig(){
  CFG = await cadence.config(); TN = CFG.tasknotes;
  VAULT = CFG.nomCoffre || 'Obsidian';
  TASK_DIR = (TN.dossier || '').replace(/\/?$/, '/');
  $('#note').textContent = CFG.coffre ? `Semaine enregistrée dans « ${CFG.donnees} » du coffre ${VAULT}. Les tâches se mettent à jour toutes seules.` : 'Aucun coffre choisi : ouvre les réglages.';
}
async function chargerDonnees(){
  const d = await cadence.lireDonnees();
  if (d && d.semaine && (Array.isArray(d.semaine.events) || Array.isArray(d.semaine.rows))){
    state = d.semaine; plan = d.plan || {}; hide = Object.assign({placed:false, blocked:false, later:true, dated:false}, d.masquer || {});
    if (ensureIds()) persist();
  } else { state = clone(DEFAULT); plan = {}; ensureIds(); persist(); }
  $('#hidePlaced').checked = hide.placed; $('#hideBlocked').checked = hide.blocked; $('#hideLater').checked = hide.later; $('#hideDated').checked = !!hide.dated;
}
async function chargerTaches(){
  if (!CFG || !CFG.coffre) return;
  const files = await cadence.lireTaches(), items = [];
  for (const f of files){ try { const t = parseTask(f.name, f.text); if (t){ t.mtime = f.mtime; items.push(t); } } catch(e){} }
  tasks = {loadedAt: new Date().toISOString(), items: resolveBlocked(items)};
  render();
}

/* nouvelle tâche */
$('#btnNewTask').onclick = () => {
  const nTag = $('#nTag'), nProj = $('#nProj'), nPrio = $('#nPrio'), nDay = $('#nDay');
  nTag.innerHTML = ''; Object.entries(tagsObj()).forEach(([k, v]) => nTag.add(new Option(v, k)));
  if (filter && !filter.startsWith('@') && !filter.startsWith('p:')) nTag.value = filter;
  nProj.innerHTML = ''; nProj.add(new Option('Aucun', ''));
  const pn = new Set(projNames()); if (tasks){ const files = new Set(tasks.items.map(t => t.file)); tasks.items.forEach(t => (t.projects || []).forEach(p => { if (!files.has(p)) pn.add(p); })); }
  [...pn].forEach(p => nProj.add(new Option('📁 ' + p, p)));
  if (filter.startsWith('p:')) nProj.value = filter.slice(2);
  nPrio.innerHTML = '';
  ((TN && TN.priorites && TN.priorites.length) ? TN.priorites : [{valeur: TN ? TN.prioriteParDefaut : 'normal', libelle: 'Par défaut'}]).forEach(q => nPrio.add(new Option(q.libelle, q.valeur)));
  if (TN) nPrio.value = TN.prioriteParDefaut;
  nDay.innerHTML = ''; nDay.add(new Option('Aucun', ''));
  weekDays.forEach((x, i) => nDay.add(new Option(`${DAYS[i]} ${x.getDate()}/${String(x.getMonth() + 1).padStart(2, '0')}`, isoOf(x))));
  $('#nTitle').value = ''; $('#nTime').value = ''; $('#nNote').value = '';
  $('#dlgNew').showModal(); $('#nTitle').focus();
};
$('#nCancel').onclick = () => $('#dlgNew').close();
$('#newForm').onsubmit = async (e) => {
  e.preventDefault();
  const jour = $('#nDay').value, heure = $('#nTime').value.trim().replace('h', ':');
  if (heure && !/^\d{1,2}:\d{2}$/.test(heure)){ alert('Heure au format 14:00'); return; }
  const planifie = jour ? jour + (heure ? 'T' + heure.padStart(5, '0') : '') : null;
  const t = {titre: $('#nTitle').value, tags: $('#nTag').value ? [$('#nTag').value] : [], projets: $('#nProj').value ? [$('#nProj').value] : [],
             priorite: $('#nPrio').value, planifie, note: $('#nNote').value};
  try { await cadence.creerTache(t); $('#dlgNew').close(); } catch(err){ alert(messageErreur(err)); }
  await chargerTaches();
};

/* réglages */
function ouvrirReglages(premier){
  $('#setIntro').classList.toggle('hidden', !premier);
  $('#sVault').textContent = (CFG && CFG.coffre) || '—';
  $('#sData').value = (CFG && CFG.donnees) || 'Cadence.json';
  $('#sTasks').textContent = TN ? TN.dossier : '—';
  $('#sTags').value = tagDefs().map(t => [t.name, t.label || t.name, t.cat || ''].join(' | ')).join('\n');
  $('#sProj').value = projDefs().map(p => [p.name, p.cat || ''].join(' | ')).join('\n');
  $('#sCats').textContent = 'Couleurs possibles : ' + Object.keys(CATS).join(', ');
  $('#dlgSet').showModal();
}
$('#btnSettings').onclick = () => ouvrirReglages(false);
$('#sCancel').onclick = () => $('#dlgSet').close();
$('#sPick').onclick = async () => {
  try {
    const c = await cadence.choisirCoffre(); if (!c) return;
    await chargerConfig(); await chargerDonnees(); ouvrirReglages(false); await chargerTaches(); render();
  } catch(e){ alert(messageErreur(e)); }
};
$('#setForm').onsubmit = async (e) => {
  e.preventDefault();
  if (!CFG || !CFG.coffre){ alert("Choisis d'abord le coffre Obsidian."); return; }
  const lignes = (v) => v.split('\n').map(l => l.split('|').map(x => x.trim())).filter(x => x[0]);
  state.tags = lignes($('#sTags').value).map(([name, label, cat]) => ({name, label: label || name, cat: CATS[cat] ? cat : 'routine'}));
  state.projects = lignes($('#sProj').value).map(([name, cat]) => ({name, cat: CATS[cat] ? cat : 'routine'}));
  const data = $('#sData').value.trim() || 'Cadence.json';
  try {
    if (data !== CFG.donnees){ await cadence.reglerDonnees(data); await chargerConfig(); const d = await cadence.lireDonnees(); if (d && d.semaine) await chargerDonnees(); }
    persist(); $('#dlgSet').close(); render();
  } catch(err){ alert(messageErreur(err)); }
};

async function demarrer(){
  if (!BUREAU){ render(); return; }
  ['#btnTasks', '#btnClearPlan'].forEach(s => $(s).classList.add('hidden'));
  ['#btnSettings', '#btnNewTask'].forEach(s => $(s).classList.remove('hidden'));
  await chargerConfig();
  if (!CFG.coffre){ state = clone(DEFAULT); ensureIds(); render(); ouvrirReglages(true); return; }
  await chargerDonnees();
  render();
  await chargerTaches();
  cadence.surChangementTaches(chargerTaches);
  cadence.surChangementDonnees(async () => { await chargerDonnees(); render(); });
}
if (!BUREAU && ensureIds()) save();
window.addEventListener('resize', drawNow);
demarrer();
})();
</script>
